{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
        <h1 class="text-3xl font-semibold text-center mb-8">{{ t("Create Account", language) }}</h1>

        <form method="POST" action="/api/auth/register" class="space-y-5">
            <div class="form-field">
                <input type="text" name="full_name" id="full_name" placeholder=" " required
                       class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red">
                <label for="full_name">{{ t("Full Name", language) }}</label>
            </div>

            <div class="form-field">
                <input type="email" name="email" id="email" placeholder=" " required
                       class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red">
                <label for="email">{{ t("Email", language) }}</label>
            </div>

            <div class="form-field">
                <input type="tel" name="phone" id="phone" placeholder=" "
                       class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red">
                <label for="phone">{{ t("Phone Number", language) }}</label>
            </div>

            <div class="form-field">
                <input type="password" name="password" id="password" placeholder=" " required minlength="8"
                       class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red">
                <label for="password">{{ t("Password", language) }}</label>
            </div>

            <button type="submit" class="btn-primary w-full">
                {{ t("Create Account", language) }}
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-600">
            {{ t("Already have an account?", language) }}
            <a href="/auth/login" class="text-brand-red hover:text-brand-red-dark font-medium">{{ t("Sign In", language) }}</a>
        </p>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
        <h1 class="text-3xl font-semibold text-center mb-8">{{ t("Welcome Back", language) }}</h1>

        <form method="POST" action="/api/auth/login" class="space-y-5">
            <div class="form-field">
                <input type="email" name="username" id="email" placeholder=" " required
                       class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red">
                <label for="email">{{ t("Email", language) }}</label>
            </div>

            <div class="form-field">
                <input type="password" name="password" id="password" placeholder=" " required
                       class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-red/20 focus:border-brand-red">
                <label for="password">{{ t("Password", language) }}</label>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-neutral-600">
                    <input type="checkbox" name="remember" class="rounded border-neutral-300">
                    {{ t("Remember me", language) }}
                </label>
                <a href="/auth/reset-password" class="text-brand-red hover:text-brand-red-dark">{{ t("Forgot password?", language) }}</a>
            </div>

            <button type="submit" class="btn-primary w-full">
                {{ t("Sign In", language) }}
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-600">
            {{ t("Don't have an account?", language) }}
            <a href="/auth/register" class="text-brand-red hover:text-brand-red-dark font-medium">{{ t("Create Account", language) }}</a>
        </p>
    </div>
</div>
{% endblock %}

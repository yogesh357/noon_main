{% extends "dashboard/layout.html" %}

{% block dashboard_content %}
<h1 class="text-2xl font-semibold mb-6">Profile</h1>

<div id="profile-form">
    {% include "dashboard/_profile_form.html" %}
</div>

<!-- Change Password Section -->
<div class="mt-8 bg-white border border-neutral-200 rounded-lg p-6">
    <h2 class="font-semibold mb-4">Change Password</h2>
    <form class="space-y-4 max-w-md">
        <div>
            <label class="block text-sm text-neutral-600 mb-1">Current Password</label>
            <input type="password" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-sm text-neutral-600 mb-1">New Password</label>
            <input type="password" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm" minlength="8">
        </div>
        <div>
            <label class="block text-sm text-neutral-600 mb-1">Confirm New Password</label>
            <input type="password" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm" minlength="8">
        </div>
        <button type="submit" class="btn-secondary text-sm">Update Password</button>
    </form>
</div>
{% endblock %}

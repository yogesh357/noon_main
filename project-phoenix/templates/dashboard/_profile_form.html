{% if saved|default(false) %}
<div class="mb-4 p-3 bg-green-50 text-green-700 text-sm rounded-lg">Profile updated successfully.</div>
{% endif %}

<div class="bg-white border border-neutral-200 rounded-lg p-6">
    <h2 class="font-semibold mb-4">Personal Information</h2>
    <form hx-post="/api/dashboard/profile" hx-target="#profile-form" hx-swap="innerHTML" class="space-y-4 max-w-md">
        <div>
            <label class="block text-sm text-neutral-600 mb-1">Full Name</label>
            <input type="text" name="full_name" value="{{ user.full_name or '' }}"
                   class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-sm text-neutral-600 mb-1">Email</label>
            <input type="email" value="{{ user.email }}" disabled
                   class="w-full px-3 py-2 border border-neutral-200 rounded-lg text-sm bg-neutral-50 text-neutral-500">
        </div>
        <div>
            <label class="block text-sm text-neutral-600 mb-1">Phone</label>
            <input type="tel" name="phone" value="{{ user.phone or '' }}"
                   class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-sm text-neutral-600 mb-1">Language</label>
            <select name="language_pref" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                <option value="id" {{ 'selected' if user.language_pref == 'id' }}>Bahasa Indonesia</option>
                <option value="en" {{ 'selected' if user.language_pref == 'en' }}>English</option>
            </select>
        </div>
        <button type="submit" class="btn-primary text-sm">Save Changes</button>
    </form>
</div>

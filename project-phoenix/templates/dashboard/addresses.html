{% extends "dashboard/layout.html" %}

{% block dashboard_content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold">Addresses</h1>
    <button
        class="btn-primary text-sm"
        x-data
        @click="document.getElementById('new-address-modal').showModal()"
    >
        Add Address
    </button>
</div>

<div id="address-list">
    {% include "dashboard/_address_list.html" %}
</div>

<!-- Add Address Modal -->
<dialog id="new-address-modal" class="rounded-lg p-0 w-full max-w-md backdrop:bg-black/50">
    <div class="p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Add New Address</h2>
            <button onclick="this.closest('dialog').close()" class="text-neutral-400 hover:text-neutral-900">&times;</button>
        </div>
        <form hx-post="/api/dashboard/addresses" hx-target="#address-list" hx-swap="innerHTML"
              hx-on::after-request="this.closest('dialog').close(); this.reset()">
            <div class="space-y-3">
                <input type="text" name="label" placeholder="Label (e.g. Home, Office)" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                <input type="text" name="full_name" placeholder="Full Name" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                <input type="tel" name="phone" placeholder="Phone" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                <textarea name="street" placeholder="Street Address" required rows="2" class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm"></textarea>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" name="city" placeholder="City" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                    <input type="text" name="province" placeholder="Province" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                </div>
                <input type="text" name="postal_code" placeholder="Postal Code" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg text-sm">
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="is_default" class="rounded">
                    Set as default
                </label>
            </div>
            <button type="submit" class="btn-primary w-full mt-4">Save Address</button>
        </form>
    </div>
</dialog>
{% endblock %}

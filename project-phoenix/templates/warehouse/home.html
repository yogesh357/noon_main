{% extends "base_warehouse.html" %}

{% block page_title %}Warehouse Home{% endblock %}

{% block content %}
<div class="grid md:grid-cols-3 gap-6">
    <a href="/warehouse/picking" class="bg-white border-2 border-neutral-200 rounded-xl p-8 text-center hover:border-brand-red hover:shadow-lg transition-all">
        <svg class="w-12 h-12 mx-auto text-neutral-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <h2 class="text-xl font-semibold mb-2">Picking</h2>
        <p class="text-neutral-500">Pick products for orders</p>
    </a>

    <a href="/warehouse/packing" class="bg-white border-2 border-neutral-200 rounded-xl p-8 text-center hover:border-brand-red hover:shadow-lg transition-all">
        <svg class="w-12 h-12 mx-auto text-neutral-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/></svg>
        <h2 class="text-xl font-semibold mb-2">Packing</h2>
        <p class="text-neutral-500">Verify and pack orders</p>
    </a>

    <a href="/warehouse/handover" class="bg-white border-2 border-neutral-200 rounded-xl p-8 text-center hover:border-brand-red hover:shadow-lg transition-all">
        <svg class="w-12 h-12 mx-auto text-neutral-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        <h2 class="text-xl font-semibold mb-2">Handover</h2>
        <p class="text-neutral-500">Hand packages to courier</p>
    </a>
</div>
{% endblock %}

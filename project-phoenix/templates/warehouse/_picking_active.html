<!-- Active picking session -->
<div class="bg-white border-2 border-blue-500 rounded-lg p-6">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold">Picking in Progress</h2>
        <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">Active</span>
    </div>

    <h3 class="font-medium text-neutral-700 mb-3">Products to Pick:</h3>
    <div class="space-y-2 mb-6">
        {% for item in checklist %}
        <div class="flex items-center justify-between p-3 bg-neutral-50 rounded-lg">
            <div>
                <p class="font-medium">{{ item.product_name }}</p>
                <p class="text-sm text-neutral-500">SKU: {{ item.sku }}{% if item.barcode %} &middot; Barcode: {{ item.barcode }}{% endif %}</p>
            </div>
            <span class="text-lg font-bold">x{{ item.quantity }}</span>
        </div>
        {% endfor %}
    </div>

    <button
        class="w-full bg-green-600 text-white px-6 py-4 rounded-lg text-lg font-semibold hover:bg-green-700 transition-colors"
        hx-post="/api/warehouse/picking/complete/{{ task.id }}"
        hx-swap="none"
    >
        Complete Picking
    </button>
</div>

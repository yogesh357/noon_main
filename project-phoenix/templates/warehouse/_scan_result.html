<!-- Generic scan result feedback -->
<div class="p-3 rounded-lg text-sm font-medium {{ 'bg-green-100 text-green-700' if result.success else 'bg-red-100 text-red-700' }}">
    {% if result.success %}
        &#10004; {{ result.message }}
    {% else %}
        &#10008; {{ result.message }}
    {% endif %}
</div>

<!DOCTYPE html>
<html lang="{{ language|default('id') }}" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Warehouse{% endblock %} — Phoenix WMS</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <script src="/static/js/barcode-scanner.js" defer></script>
    <script src="/static/js/audio-feedback.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% block head_extra %}{% endblock %}
</head>
<body class="min-h-screen bg-neutral-100" x-data="{ sidebarOpen: true }">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside
            class="w-64 bg-neutral-900 text-white flex-shrink-0 flex flex-col"
            :class="sidebarOpen ? '' : 'hidden'"
        >
            <div class="px-6 py-5 border-b border-neutral-700">
                <span class="text-lg font-bold tracking-tight">Phoenix WMS</span>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a href="/warehouse/picking" class="flex items-center gap-3 px-3 py-3 rounded-lg text-neutral-300 hover:bg-neutral-800 hover:text-white transition-colors text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    Picking
                </a>
                <a href="/warehouse/packing" class="flex items-center gap-3 px-3 py-3 rounded-lg text-neutral-300 hover:bg-neutral-800 hover:text-white transition-colors text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/></svg>
                    Packing
                </a>
                <a href="/warehouse/handover" class="flex items-center gap-3 px-3 py-3 rounded-lg text-neutral-300 hover:bg-neutral-800 hover:text-white transition-colors text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                    Handover
                </a>
            </nav>
            <div class="px-3 py-4 border-t border-neutral-700">
                <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg text-neutral-400 hover:text-white transition-colors text-sm">
                    Back to Store
                </a>
            </div>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Top bar -->
            <header class="bg-white border-b border-neutral-200 px-6 py-4 flex items-center justify-between">
                <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-lg hover:bg-neutral-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-lg font-semibold">{% block page_title %}Warehouse{% endblock %}</h1>
                <div class="text-sm text-neutral-500">
                    {% block user_info %}Staff{% endblock %}
                </div>
            </header>

            <!-- Page content -->
            <main class="flex-1 overflow-y-auto p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
